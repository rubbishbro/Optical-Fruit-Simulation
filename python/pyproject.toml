[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fruitsim-ml"
version = "0.4.0"
description = "Reproducible SSC modeling companion for fruitsim"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "scipy>=1.13,<2",
  "scikit-learn>=1.5,<2",
  "joblib>=1.4,<2"
]

[project.scripts]
fruitsim-ml = "fruitsim_ml.__main__:main"
fruitsim-shape = "fruitsim_shape.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fruitsim_ml*", "fruitsim_shape*"]
