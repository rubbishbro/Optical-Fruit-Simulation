name: CI

on:
  push:
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DFRUITSIM_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Smoke simulation
        run: ./build/apps/fruitsim_cli/fruitsim_cli run --config configs/golden_delicious_demo.json --photons 100 --threads 2 --output /tmp/fruitsim-ci

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ./python
      - run: fruitsim-ml generate-demo --output data/synthetic/synthetic_golden_delicious_smoke.csv --samples 80 --seed 42
      - run: fruitsim-ml train --config configs/ml_smoke_test.json
